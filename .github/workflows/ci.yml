name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The agent-tools wiring imports wazoo-tools' source directly
      # (../../../../wazoo-tools/src/mod) until PR #7 publishes to JSR —
      # check it out at the same relative depth the import expects, then
      # link it into the workspace as the sibling repo.
      - uses: actions/checkout@v4
        with:
          repository: wazootech/wazoo-tools
          ref: feat/make-wazoo-tools-canonical-veneer-over-worlds-sdk
          path: wazoo-tools-checkout
      # The import '.../../wazoo-tools/src/mod' resolves relative to the
      # source file: <repo>/src/providers/worlds -> 4 up = <workspace root>,
      # so the sibling must live at $GITHUB_WORKSPACE/../../../../workspaces/wazootech/repos/wazoo-tools.
      - name: Link wazoo-tools sibling for the relative import
        run: |
          SIBLING="$GITHUB_WORKSPACE/../../../../workspaces/wazootech/repos"
          mkdir -p "$SIBLING"
          ln -s "$GITHUB_WORKSPACE/wazoo-tools-checkout" "$SIBLING/wazoo-tools"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bunx tsc --noEmit

  # Windows leg: pins the bun:sqlite backend behavior that ubuntu CI cannot
  # cover: sqlite-vec's win32 prebuilt (vec0.dll) loading through
  # bun:sqlite's loadExtension, and hybrid search returning rows through it
  # (src/providers/worlds/bun-sqlite-vec0.test.ts). The rest of the suite
  # runs here too so Windows-specific runtime breakage surfaces on every PR.
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
